name: Build and Auto-Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and gh-pages branch fallback
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Typecheck & Linter
        run: npm run lint

      - name: Run Data Propagation & Parity Test Suite
        run: npx tsx scripts/test_sheets_to_app_propagation.ts

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build Application Bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || './' }}
        run: |
          npm run build
          touch dist/.nojekyll
          # Ensure .nojekyll, 404.html, and 200.html are preserved in dist for SPA client-side routing
          if [ -f public/404.html ]; then
            cp public/404.html dist/404.html
          fi
          if [ -f public/.nojekyll ]; then
            cp public/.nojekyll dist/.nojekyll
          fi
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/200.html
          fi

      - name: Deploy to gh-pages Branch (Branch Deployment Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (Actions Deployment)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
