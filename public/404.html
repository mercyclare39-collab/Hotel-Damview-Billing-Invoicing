<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hotel Damview Management Suite</title>
    <script>
      // Universal Single Page App redirect for GitHub Pages
      (function(l) {
        var isGithubIo = l.hostname.endsWith('github.io');
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var repoPrefix = (isGithubIo && pathSegments.length > 0) ? '/' + pathSegments[0] + '/' : '/';
        var appPath = isGithubIo ? pathSegments.slice(1).join('/') : pathSegments.join('/');

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoPrefix +
          '?p=/' + appPath.replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }(window.location));
    </script>
  </head>
  <body>
    <p>Redirecting to Hotel Damview Management Suite...</p>
  </body>
</html>
