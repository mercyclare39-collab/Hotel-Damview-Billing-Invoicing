<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
  
  <!-- Outer Gold Crest Circle -->
  <circle cx="256" cy="256" r="180" fill="#292524" stroke="url(#goldGrad)" stroke-width="8" filter="url(#goldGlow)" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Hotel Building & Monogram Motif -->
  <!-- Roof / Pediment -->
  <polygon points="256,125 360,195 152,195" fill="url(#goldGrad)" />
  <!-- Pillars / Hotel structure -->
  <rect x="175" y="205" width="28" height="150" rx="4" fill="url(#goldGrad)" />
  <rect x="242" y="205" width="28" height="150" rx="4" fill="url(#goldGrad)" />
  <rect x="309" y="205" width="28" height="150" rx="4" fill="url(#goldGrad)" />
  <!-- Base Foundation -->
  <rect x="145" y="360" width="222" height="24" rx="4" fill="url(#goldGrad)" />
  <!-- Waves / Dam Waters Motif -->
  <path d="M 120 405 Q 188 385 256 405 T 392 405" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 145 425 Q 200 410 256 425 T 367 425" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
